name: Android build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy 'tools' package is no longer distributed by Google.
          packages: 'platform-tools'
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test cadence clock
        run: |
          mkdir -p app/build/clock-tests
          javac --release 8 -encoding UTF-8 -d app/build/clock-tests app/src/main/java/com/stepbeat/app/BeatClock.java app/src/main/java/com/stepbeat/app/TrainingClock.java tests/BeatClockTest.java tests/TrainingClockTest.java
          java -cp app/build/clock-tests com.stepbeat.app.BeatClockTest
          java -cp app/build/clock-tests com.stepbeat.app.TrainingClockTest
      - name: Build debug APK
        run: bash ./gradlew --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: stepbeat-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
